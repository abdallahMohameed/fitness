<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>التمرين والأكل</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="التمرين">
<meta name="theme-color" content="#0E1113">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  --bg:#0E1113; --surf:#171C20; --surf2:#1F262B; --line:#2C353B;
  --ink:#EDF2F4; --dim:#8A9AA3; --acid:#C6F542; --amber:#FFB020; --red:#FF5C5C;
  font-family:'Tajawal',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; padding:16px; max-width:720px; margin:0 auto;
}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font-size:26px;font-weight:900;margin:0;letter-spacing:-.5px}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.cd{text-align:left}
.cd b{display:block;font-size:30px;font-weight:900;color:var(--acid);line-height:1}
.cd span{font-size:11px;color:var(--dim)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;min-width:72px;padding:10px 4px;border-radius:10px;background:var(--surf);
  border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;
  text-align:center;font-family:inherit}
.tab.on{background:var(--acid);color:#0E1113;border-color:var(--acid)}
.tab:focus-visible,.chk:focus-visible,.wt:focus-visible,.bk:focus-visible,.exn:focus-visible
  {outline:2px solid var(--acid);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ttl{font-size:16px;font-weight:900;margin:0 0 10px}
.ex{border-bottom:1px solid var(--line);padding:10px 0}
.ex:last-of-type{border-bottom:none}
.exrow{display:flex;align-items:center;gap:10px}
.exn{flex:1;min-width:0;background:none;border:none;color:var(--ink);text-align:right;
  cursor:pointer;font-family:inherit;padding:0}
.exn b{display:block;font-size:14px;font-weight:700}
.exn span{font-size:11px;color:var(--dim)}
.exn .more{color:var(--acid);font-size:11px;font-weight:700}
.wt{width:62px;background:var(--surf2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:8px 6px;text-align:center;font-size:14px;font-weight:700;font-family:inherit}
.chk{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);
  background:transparent;cursor:pointer;font-size:17px;color:var(--dim);flex-shrink:0;font-family:inherit}
.chk.on{background:var(--acid);border-color:var(--acid);color:#0E1113}
.panel{margin-top:10px;background:var(--surf2);border-radius:10px;padding:11px}
.shots{display:flex;gap:8px}
.shot{flex:1;min-width:0}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#0B0E10;display:block}
.shot figcaption{font-size:10px;color:var(--dim);text-align:center;margin-top:3px}
.cues{margin:10px 6px 0;padding:0}
.cues li{font-size:12.5px;line-height:1.75;color:var(--ink);margin-bottom:4px}
.cues li::marker{color:var(--acid)}
.cues b{color:var(--amber)}
.alt{font-size:11.5px;color:var(--dim);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.alt b{color:var(--ink)}
.hab{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.hab:last-of-type{border-bottom:none}
.hab p{flex:1;margin:0;font-size:14px;font-weight:500}
.hab small{display:block;color:var(--dim);font-size:11px;font-weight:400;margin-top:1px}
.rest{text-align:center;padding:26px 12px;color:var(--dim);line-height:1.8}
.rest b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}
.note{background:var(--surf2);border-right:3px solid var(--amber);border-radius:0 8px 8px 0;
  padding:9px 11px;font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.note b{color:var(--amber)}
.note.bad{border-right-color:var(--red)}
.note.bad b{color:var(--red)}
.sv{text-align:center;font-size:11px;color:var(--dim);padding:8px 0 4px}
.sv b{color:var(--acid)}
details{margin-bottom:24px}
summary{text-align:center;font-size:11px;color:var(--dim);cursor:pointer;padding:6px}
.bkwrap{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:8px}
textarea{width:100%;height:110px;background:var(--surf2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:8px;font-size:11px;font-family:ui-monospace,monospace;resize:vertical}
.bk{margin-top:8px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--surf2);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

var IMG = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";

/* ---------- التخزين ---------- */
var MODE = "memory", MEM = {};
try { var ls = window["local"+"Storage"]; ls.setItem("__p","1"); ls.removeItem("__p"); MODE = "local"; } catch(e){}

function rd(k){
  if (MODE === "local"){ try { var v = window["local"+"Storage"].getItem(k); return v ? JSON.parse(v) : null; } catch(e){} }
  return MEM[k] || null;
}
function wr(k,v){
  if (MODE === "local"){ try { window["local"+"Storage"].setItem(k, JSON.stringify(v)); return; } catch(e){} }
  MEM[k] = v;
}
function allKeys(){
  var out = [];
  if (MODE === "local"){ try { var s = window["local"+"Storage"];
    for (var i=0;i<s.length;i++){ var k = s.key(i); if (k.indexOf("gym:")===0) out.push(k); } } catch(e){} }
  else { for (var k2 in MEM) if (MEM.hasOwnProperty(k2)) out.push(k2); }
  return out;
}

/* ---------- التمارين ---------- */
function E(k,ar,en,sets,cues,alt,noWeight){
  return {k:k, ar:ar, en:en, sets:sets, cues:cues, alt:alt, nw:!!noWeight};
}

var PLAN = {
  0:{n:"الأحد", t:"ضهر وبايسبس", ex:[
    E("Wide-Grip_Lat_Pulldown","سحب أمامي واسع","Wide-Grip Lat Pulldown","٣ × ١٠-١٢",
      ["صدرك عالي وميلة خفيفة لورا — مش قعدة مستقيمة",
       "اسحب البار لأعلى صدرك، <b>مش ورا رقبتك</b>",
       "نزّل كتفك لتحت الأول، بعدين اثني كوعك"],
      "سحب أمامي بقبضة ضيقة لو الجهاز مشغول"),
    E("Seated_Cable_Rows","تجديف قاعد بالكابل","Seated Cable Row","٣ × ١٠-١٢",
      ["ضهرك مفرود وصدرك لقدام — متقوّسش ضهرك",
       "اسحب المقبض لبطنك مش لصدرك",
       "اعصر لوحي كتفك مع بعض في آخر الحركة"],
      "تجديف بالماكينة"),
    E("Straight-Arm_Pulldown","سحب مستقيم بالكابل","Straight-Arm Pulldown","٣ × ١٢-١٥",
      ["كوعك فيه ثنية بسيطة <b>ثابتة</b> طول الحركة",
       "الحركة من الكتف مش من الكوع",
       "ميلة خفيفة لقدام من الورك مش من الضهر"],
      "نفس التمرين بالحبل"),
    E("Standing_Biceps_Cable_Curl","بايسبس بالكابل واقف","Standing Cable Curl","٣ × ١٢",
      ["كوعك ملزوق في جنبك ومايتحركش لقدام",
       "وقف ثانية في الأعلى واعصر",
       "نزّل ببطء — <b>الرجعة نص التمرين</b>"],
      "بايسبس بالدامبل")]},

  1:{n:"الاتنين", t:"رجل وكارديو 🧖", ex:[
    E("Barbell_Hip_Thrust","جسر المؤخرة","Hip Thrust","٣ × ١٢",
      ["ظهرك على الدكة عند نص لوح الكتف",
       "ادفع من <b>كعبك</b> واعصر المؤخرة فوق",
       "الحوض هو اللي بيلف — متقوّسش ضهرك"],
      "جسر المؤخرة على الأرض من غير وزن"),
    E("Lying_Leg_Curls","ثني الرجل راقد","Lying Leg Curl","٣ × ١٢",
      ["الوسادة فوق كعبك مش على السمانة",
       "حوضك ملزوق في الدكة ومايتقلعش",
       "<b>دي العضلة اللي بتحمي ركبتك</b> — متستعجلش فيها"],
      "ثني الرجل قاعد"),
    E("Leg_Press","ضغط رجل بمدى محدود","Leg Press","٣ × ١٢",
      ["<b>وقف عند ٩٠ درجة — متنزلش أعمق</b>",
       "رجلك بعرض الكتف في نص المنصة",
       "متفردش ركبتك بالكامل في الأعلى"],
      "ضغط رجل بماكينة أفقية"),
    E("Calf_Press_On_The_Leg_Press_Machine","السمانة على ماكينة الرجل","Calf Press","٣ × ١٥",
      ["مقدمة رجلك على حافة المنصة",
       "ادفع لأقصى مدى وارجع ببطء",
       "ركبتك شبه مفرودة وثابتة"],
      "السمانة واقف"),
    E("Leg_Extensions","مد الرجل","Leg Extension","٣ × ١٥",
      ["<b>وزن خفيف جداً ومدى جزئي — متفردش بالكامل</b>",
       "الوسادة فوق الكاحل مش على الساق",
       "<b>أي شد في الركبة = اشطب التمرين ده خالص</b>"],
      "لو في أي شك — اشطبه. مش تمرين ضروري"),
    E("Elliptical_Trainer","إليبتيكال أو دراجة","Elliptical / Bike","٢٠ دقيقة",
      ["شدة تخليك تقدر تتكلم بصعوبة بس تقدر",
       "اتكل على رجلك مش على المقابض",
       "<b>مفيش جري</b>"],
      "دراجة ثابتة", true)]},

  2:{n:"التلات", rest:true},

  3:{n:"الأربعاء", t:"صدر وترايسبس", ex:[
    E("Leverage_Chest_Press","ضغط صدر بالماكينة","Chest Press Machine","٣ × ١٠-١٢",
      ["المقابض عند نص صدرك بالظبط",
       "لوح كتفك مضغوط في المسند ورجلك ثابتة",
       "انزل ببطء ثانيتين، وادفع من غير ما تفرد كوعك بالكامل"],
      "ضغط صدر بالكابل واقف"),
    E("Leverage_Incline_Chest_Press","ضغط صدر مايل","Incline Chest Press","٣ × ١٠-١٢",
      ["المقابض عند أعلى صدرك",
       "كتفك لازق في المسند طول التمرين",
       "ادفع بصدرك العلوي مش بكتفك"],
      "ضغط مايل بالكابل"),
    E("Butterfly","تفتيح (بيك ديك)","Pec Deck","٣ × ١٢-١٥",
      ["كوعك فيه ثنية بسيطة ثابتة",
       "اقفل واعصر ثانية في النص",
       "الرجعة البطيئة نص التمرين"],
      "تفتيح بالكابل"),
    E("Triceps_Pushdown_-_Rope_Attachment","ترايسبس بالحبل","Rope Pushdown","٣ × ١٢-١٥",
      ["كوعك ملزوق في جنبك",
       "افتح الحبل في آخر الحركة واعصر",
       "<b>ممنوع تدفع بوزن جسمك</b>"],
      "نفس التمرين بالبار")]},

  4:{n:"الخميس", t:"كتف وبطن", ex:[
    E("Leverage_Shoulder_Press","ضغط كتف بالماكينة","Shoulder Press Machine","٣ × ١٠-١٢",
      ["المقابض عند مستوى ودانك",
       "بطنك مشدودة وضهرك مش مقوّس",
       "انزل لحد ٩٠ درجة بس"],
      "ضغط كتف بالكابل قاعد"),
    E("Side_Lateral_Raise","رفرفة جانبية","Lateral Raise","٣ × ١٢-١٥",
      ["ارفع <b>لحد مستوى الكتف بس</b>",
       "كوعك أعلى من رسغك — كأنك بتصب مية",
       "وزن خفيف دايماً — ده تمرين شكل مش تمرين قوة"],
      "رفرفة بالكابل أو بالماكينة"),
    E("Reverse_Machine_Flyes","رفرفة خلفية بالماكينة","Reverse Pec Deck","٣ × ١٢-١٥",
      ["صدرك لازق في الوسادة",
       "افتح من لوحي كتفك مش من كوعك",
       "دي بتصلح وقفة الكتف قدام الكاميرا"],
      "رفرفة خلفية بالكابل"),
    E("Plank","بلانك","Plank","٣ × ٣٠ ثانية",
      ["جسمك خط مستقيم من كتفك لكعبك",
       "<b>متطلعش مؤخرتك ومتنزلهاش</b>",
       "اشد بطنك ومؤخرتك مع بعض"],
      "بلانك على الركب لو صعب", true)]},

  5:{n:"الجمعة", t:"كارديو 🧖", ex:[
    E("Elliptical_Trainer","إليبتيكال أو دراجة","Elliptical / Bike","٣٠-٤٠ دقيقة",
      ["شدة تخليك تقدر تتكلم بصعوبة بس تقدر",
       "اتكل على رجلك مش على المقابض",
       "<b>مفيش جري</b> — الركبة"],
      "دراجة ثابتة", true)]},

  6:{n:"السبت", rest:true,
     msg:"النهاردة القياس: <b style='color:#EDF2F4'>الوزن ومحيط الوسط عند السرة</b>.<br>بعد الحمام، قبل الأكل، نفس الهدوم — نفس الظروف كل أسبوع.<br>ومتوزنش تاني قبل السبت الجاي."}
};

var HABITS = [
  ["صفر سكر في المشروبات","الشاي والقهوة سادة. دي أكبر رافعة في النظام كله"],
  ["مفيش مشروب غازي","لو محتاج الإحساس: مية غازية أو دايت"],
  ["آخر أكلة قبل ٩","لو هتبقى بره، كُل قبل ما تسيب مدينة نصر مش لما ترجع"],
  ["بروتين واضح في كل وجبة","فول، فرخة مشوية، تونة، بيض"],
  ["مشوي مش مقلي","فول بدل طعمية — نفس المحل ونفس السعر"],
  ["نمت ٧ ساعات","ثبّت ميعاد الصحيان مش ميعاد النوم"]
];

/* ---------- التواريخ ---------- */
function p2(n){ return n < 10 ? "0"+n : ""+n; }
function keyOf(d){ return "gym:"+d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function shift(o){ var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+o); return d; }
function fmt(d){
  try { return d.toLocaleDateString("ar-EG",{day:"numeric",month:"long"}); }
  catch(e){ return d.getDate()+"/"+(d.getMonth()+1); }
}
function daysLeft(){
  var w = new Date(2026,10,6); w.setHours(0,0,0,0);
  var n = new Date(); n.setHours(0,0,0,0);
  return Math.max(0, Math.round((w-n)/864e5));
}

/* ---------- الحالة ---------- */
var off = 0, date = shift(0), data = {ex:{},hab:{}}, open = {};

function loadDay(){ date = shift(off); data = rd(keyOf(date)) || {ex:{},hab:{}}; }
function persist(){ wr(keyOf(date), data); flash(); }

var ft = null;
function flash(){
  var e = document.getElementById("sv"); if(!e) return;
  e.innerHTML = "<b>اتحفظ</b>";
  clearTimeout(ft);
  ft = setTimeout(function(){ e.innerHTML = statusText(); }, 1400);
}
function statusText(){
  return MODE === "local" ? "الحفظ شغال على الجهاز ده"
    : "<b style='color:#FF5C5C'>الحفظ مقفول</b> — اللي تسجله هيضيع لما تقفل الصفحة";
}

function el(tag, cls, html){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------- لوحة الشرح ---------- */
function panel(x){
  var p = el("div","panel");
  var shots = el("div","shots");
  ["البداية","النهاية"].forEach(function(cap,i){
    var f = document.createElement("figure");
    f.className = "shot";
    var im = document.createElement("img");
    im.loading = "lazy";
    im.alt = x.ar + " — " + cap;
    im.src = IMG + x.k + "/" + i + ".jpg";
    im.onerror = function(){ im.style.display = "none"; };
    f.appendChild(im);
    f.appendChild(el("figcaption", null, cap));
    shots.appendChild(f);
  });
  p.appendChild(shots);

  var ul = el("ul","cues");
  x.cues.forEach(function(c){ ul.appendChild(el("li", null, c)); });
  p.appendChild(ul);

  if (x.alt) p.appendChild(el("div","alt","<b>بديل:</b> " + esc(x.alt)));
  return p;
}

/* ---------- الرسم ---------- */
function render(){
  loadDay();
  var dow = date.getDay(), day = PLAN[dow];
  var app = document.getElementById("app");
  app.innerHTML = "";

  var hd = el("div","hd");
  hd.appendChild(el("div", null,
    "<h1>التمرين والأكل</h1><div class='sub'>" + esc(fmt(date)) + " · " + esc(day.n) + "</div>"));
  hd.appendChild(el("div","cd","<b>" + daysLeft() + "</b><span>يوم للفرح</span>"));
  app.appendChild(hd);

  var tabs = el("div","tabs");
  [-2,-1,0,1,2].forEach(function(o){
    var d = shift(o);
    var t = el("button","tab" + (o===off ? " on" : ""), o===0 ? "النهاردة" : esc(PLAN[d.getDay()].n));
    t.onclick = function(){ off = o; open = {}; render(); };
    tabs.appendChild(t);
  });
  app.appendChild(tabs);

  var card = el("div","card");
  if (day.rest){
    card.appendChild(el("div","rest",
      "<b>يوم راحة</b>" + (day.msg || "الاستشفاء بيحصل وأنت نايم، مش وأنت بتتمرن.")));
  } else {
    card.appendChild(el("p","ttl", esc(day.t)));

    day.ex.forEach(function(x,i){
      var k = dow + ":" + i;
      var wrap = el("div","ex");
      var row = el("div","exrow");

      var btn = el("button","chk" + (data.ex[k] ? " on" : ""), data.ex[k] ? "✓" : "");
      btn.setAttribute("aria-label","تم " + x.ar);
      btn.onclick = function(){
        data.ex[k] = !data.ex[k];
        btn.className = "chk" + (data.ex[k] ? " on" : "");
        btn.innerHTML = data.ex[k] ? "✓" : "";
        persist();
      };
      row.appendChild(btn);

      var name = el("button","exn",
        "<b>" + esc(x.ar) + "</b><span>" + esc(x.en) + " — " + esc(x.sets) +
        " <span class='more'>▼ الشرح والصور</span></span>");
      name.setAttribute("aria-expanded","false");
      row.appendChild(name);

      if (!x.nw){
        var inp = document.createElement("input");
        inp.className = "wt"; inp.placeholder = "كجم"; inp.inputMode = "numeric";
        inp.setAttribute("aria-label","وزن " + x.ar);
        inp.value = data.ex[k+":w"] || "";
        inp.oninput = function(){ data.ex[k+":w"] = inp.value; persist(); };
        row.appendChild(inp);
      }
      wrap.appendChild(row);

      var pan = null;
      name.onclick = function(){
        if (pan){ wrap.removeChild(pan); pan = null; }
        else { pan = panel(x); wrap.appendChild(pan); }
        name.setAttribute("aria-expanded", pan ? "true" : "false");
        name.querySelector(".more").innerHTML = pan ? "▲ اقفل" : "▼ الشرح والصور";
      };

      card.appendChild(wrap);
    });

    if (dow === 1){
      card.appendChild(el("div","note bad",
        "<b>الركبة:</b> أي وجع = وقف التمرين ده فوراً، مش «كمّل بالراحة». مفيش قفز ولا سكوات عميق ولا جري. ابدأ بأخف وزن على الماكينة، وزوّد بس بعد أسبوع كامل من غير أي إحساس."));
    }
    card.appendChild(el("div","note",
      "<b>التدرج:</b> لما تعمل أعلى رقم في المدى وأنت حاسس إنك تقدر على اتنين زيادة — زوّد الوزن. سجّل الرقم كل مرة عشان تعرف إنت فين."));
  }
  app.appendChild(card);

  var hc = el("div","card");
  hc.appendChild(el("p","ttl","عادات اليوم"));
  HABITS.forEach(function(pair,i){
    var row = el("div","hab");
    var b = el("button","chk" + (data.hab[i] ? " on" : ""), data.hab[i] ? "✓" : "");
    b.setAttribute("aria-label", pair[0]);
    b.onclick = function(){
      data.hab[i] = !data.hab[i];
      b.className = "chk" + (data.hab[i] ? " on" : "");
      b.innerHTML = data.hab[i] ? "✓" : "";
      persist();
    };
    row.appendChild(b);
    row.appendChild(el("p", null, esc(pair[0]) + (pair[1] ? "<small>" + esc(pair[1]) + "</small>" : "")));
    hc.appendChild(row);
  });
  hc.appendChild(el("div","note",
    "<b>النافذة: ١٢ ظهراً – ٩ مساءً.</b> في الصيام مسموح: مية وشاي وقهوة سادة ومشروبات دايت. متحسبش سعرات — إنت بتاكل بره كل يوم فالحساب هيبقى غلط وهتزهق منه. قاعدتين بس: بروتين في كل وجبة، ومشوي بدل مقلي."));
  app.appendChild(hc);

  if (MODE !== "local"){
    app.appendChild(el("div","note bad",
      "<b>تحذير:</b> المتصفح مانع الحفظ في المكان ده. افتح «نسخة احتياطية» تحت وانسخ الداتا قبل ما تقفل — أو افتح التطبيق من لينك مباشر بدل الـ embed."));
  }

  app.appendChild(el("div","sv", null)).id = "sv";
  document.getElementById("sv").innerHTML = statusText();
  app.appendChild(backup());
}

/* ---------- نسخة احتياطية ---------- */
function backup(){
  var d = document.createElement("details");
  d.appendChild(el("summary", null, "نسخة احتياطية"));
  var w = el("div","bkwrap");
  var ta = document.createElement("textarea");
  ta.setAttribute("aria-label","بيانات النسخة الاحتياطية");
  w.appendChild(ta);

  var out = el("button","bk","اطلع الداتا");
  out.onclick = function(){
    var o = {};
    allKeys().forEach(function(k){ o[k] = rd(k); });
    ta.value = JSON.stringify(o);
  };
  var inb = el("button","bk","ارجّع الداتا");
  inb.style.marginRight = "8px";
  inb.onclick = function(){
    try {
      var o = JSON.parse(ta.value);
      for (var k in o) if (o.hasOwnProperty(k) && k.indexOf("gym:")===0) wr(k,o[k]);
      render();
    } catch(e){ ta.value = "الداتا مش مظبوطة — الصق النص كامل تاني."; }
  };
  w.appendChild(out); w.appendChild(inb);
  d.appendChild(w);
  return d;
}

render();
})();
</script>
