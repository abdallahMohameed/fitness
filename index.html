
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apartment Finishing Tracker</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:20px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0002;margin-bottom:20px}
.progress{height:22px;background:#ddd;border-radius:20px;overflow:hidden}
.bar{height:100%;background:#4caf50;width:0%}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid #eee}
input[type=number]{width:90px}
</style>
</head>
<body>
<div class="card">
<h1>🏠 متابعة تشطيب الشقة</h1>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="txt"></p>
</div>

<div class="card">
<h2>Checklist</h2>
<div id="list"></div>
</div>

<script>
const defaultTasks=[
["تأسيس الكهرباء",false,15000],
["السباكة",false,12000],
["المحارة",false,18000],
["الجبس",false,10000],
["السيراميك",false,22000],
["الدهانات",false,12000],
["الألوميتال",false,15000],
["الأبواب",false,18000],
["المطبخ",false,45000],
["الحمامات",false,18000],
["التكييفات",false,30000],
["الاستلام النهائي",false,0]
];
let tasks=JSON.parse(localStorage.getItem("finishTasks")||"null")||defaultTasks;

function save(){localStorage.setItem("finishTasks",JSON.stringify(tasks));}

function render(){
const list=document.getElementById("list");
list.innerHTML="";
let done=0,total=0,cost=0;
tasks.forEach((t,i)=>{
total++;
if(t[1])done++;
cost+=Number(t[2]||0);
let d=document.createElement("div");
d.className="item";
d.innerHTML=`<input type="checkbox" ${t[1]?"checked":""}>
<input value="${t[0]}" style="flex:1">
<input type="number" value="${t[2]}">
<button>🗑️</button>`;
let c=d.children;
c[0].onchange=()=>{tasks[i][1]=c[0].checked;save();render();}
c[1].oninput=()=>{tasks[i][0]=c[1].value;save();}
c[2].oninput=()=>{tasks[i][2]=+c[2].value;save();render();}
c[3].onclick=()=>{tasks.splice(i,1);save();render();}
list.appendChild(d);
});
let p=Math.round(done/Math.max(total,1)*100);
document.getElementById("bar").style.width=p+"%";
document.getElementById("txt").innerHTML=`${p}% | المنجز ${done}/${total} | إجمالي التكلفة: ${cost.toLocaleString("ar-EG")} جنيه`;
}
render();

const add=document.createElement("button");
add.textContent="➕ إضافة بند";
add.onclick=()=>{tasks.push(["بند جديد",false,0]);save();render();}
document.body.appendChild(add);

const ex=document.createElement("button");
ex.textContent="📤 Export JSON";
ex.style.marginRight="10px";
ex.onclick=()=>{
const blob=new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="apartment-checklist.json";
a.click();
};
document.body.appendChild(ex);
</script>
</body>
</html>
