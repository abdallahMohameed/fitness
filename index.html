<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>التمرين والأكل — ٦ نوفمبر</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="التمرين">
<meta name="theme-color" content="#0E1113">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{--bg:#0E1113;--surf:#171C20;--surf2:#1F262B;--line:#2C353B;--ink:#EDF2F4;--dim:#8A9AA3;
 --acid:#C6F542;--amber:#FFB020;--red:#FF5C5C;--blue:#5CC8FF;
 font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);
 min-height:100vh;font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 96px}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
h1{font-size:23px;font-weight:900;letter-spacing:-.5px}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.cd{text-align:left;flex-shrink:0}
.cd b{display:block;font-size:30px;font-weight:900;color:var(--acid);line-height:1}
.cd span{font-size:11px;color:var(--dim)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ttl{font-size:15px;font-weight:900;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{font-size:11px;color:var(--dim)}
.kn{font-size:25px;font-weight:900;color:var(--acid);line-height:1.2}
.bar{height:7px;background:var(--surf2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acid)}
.note{background:var(--surf2);border-right:3px solid var(--amber);border-radius:0 8px 8px 0;
 padding:9px 11px;font-size:12px;color:var(--dim);margin-top:10px;line-height:1.65}
.note b{color:var(--amber)}
.note.bad{border-right-color:var(--red)}.note.bad b{color:var(--red)}
.note.ok{border-right-color:var(--acid)}.note.ok b{color:var(--acid)}
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wkbtn{background:var(--surf);border:1px solid var(--line);color:var(--ink);border-radius:9px;
 padding:7px 12px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}
.wklbl{flex:1;text-align:center;font-size:12px;color:var(--dim);font-weight:700}
.tabs{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;min-width:46px;padding:8px 2px;border-radius:10px;background:var(--surf);
 border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.tab.on{background:var(--acid);color:#0E1113;border-color:var(--acid)}
.tab.today{border-color:var(--acid)}
.tab small{display:block;font-size:9px;opacity:.75;font-weight:400}
.grp{font-size:11px;font-weight:900;color:var(--dim);letter-spacing:.5px;margin:14px 0 2px;
 padding-top:10px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:none;padding-top:0;margin-top:8px}
.ex{border-bottom:1px solid var(--line);padding:11px 0}
.ex:last-of-type{border-bottom:none}
.exhead{display:flex;align-items:flex-start;gap:9px}
.exname{flex:1;min-width:0;text-align:right;background:none;border:none;color:var(--ink);padding:0;cursor:pointer}
.exname b{display:block;font-size:14px;font-weight:700}
.exname span{font-size:11px;color:var(--dim)}
.more{color:var(--acid);font-size:11px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:6px;flex-shrink:0}
.dot.on{background:var(--acid)}
.sets{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.set{display:flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--line);
 border-radius:9px;padding:4px 6px}
.set input{width:46px;background:transparent;border:none;color:var(--ink);text-align:center;font-size:14px;font-weight:700}
.set input::placeholder{font-size:11px;font-weight:500;color:var(--dim)}
.set:has(input[aria-label="دقايق الكارديو الفعلية"]){flex:1}
.set input[aria-label="دقايق الكارديو الفعلية"]{width:100%;min-width:96px;text-align:right;padding-right:4px}
.set input::placeholder{color:var(--dim);font-weight:400}
.setchk{min-width:34px;height:30px;padding:0 5px;border-radius:8px;border:2px solid var(--line);
 background:transparent;color:var(--dim);cursor:pointer;font-size:13px;font-weight:700;flex-shrink:0}
.setchk.on{background:var(--acid);border-color:var(--acid);color:#0E1113}
.panel{margin-top:10px;background:var(--surf2);border-radius:10px;padding:11px}
.shots{display:flex;gap:8px}
.shot{flex:1;min-width:0}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#0B0E10;display:block}
.shot figcaption{font-size:10px;color:var(--dim);text-align:center;margin-top:3px}
.cues{margin:10px 6px 0}
.cues li{font-size:12.5px;line-height:1.75;margin-bottom:3px}
.cues li::marker{color:var(--acid)}
.cues b{color:var(--amber)}
.alt{font-size:11.5px;color:var(--dim);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.alt b{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:none}
.row p{flex:1;margin:0;font-size:14px;font-weight:500}
.row small{display:block;color:var(--dim);font-size:11px;font-weight:400;margin-top:1px}
.chk{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);background:transparent;
 color:var(--dim);cursor:pointer;font-size:16px;flex-shrink:0}
.chk.on{background:var(--acid);border-color:var(--acid);color:#0E1113}
.water{display:flex;flex-wrap:wrap;gap:7px}
.cup{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:transparent;
 cursor:pointer;font-size:14px;color:var(--dim)}
.cup.on{background:var(--blue);border-color:var(--blue);color:#0E1113}
.qrow{display:flex;gap:8px;margin-top:8px}
.qrow input{flex:1;background:var(--surf2);border:1px solid var(--line);color:var(--ink);
 border-radius:9px;padding:9px;font-size:15px;font-weight:700;text-align:center;min-width:0}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surf2);
 color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.btn.p{background:var(--acid);border-color:var(--acid);color:#0E1113}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.badge{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:10px 6px;text-align:center;opacity:.32}
.badge.on{opacity:1;border-color:var(--acid)}
.badge i{font-style:normal;font-size:22px;display:block}
.badge b{display:block;font-size:11px;font-weight:700;margin-top:3px}
.badge span{font-size:9px;color:var(--dim)}
.mini{font-size:12px;color:var(--dim);line-height:1.7}
.mini b{color:var(--ink)}
.col{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:9px;background:var(--surf)}
.col>summary{padding:12px;font-size:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.col>summary::-webkit-details-marker{display:none}
.col>summary::after{content:"▼";color:var(--acid);font-size:11px}
.col[open]>summary::after{content:"▲"}
.colb{padding:0 12px 12px;font-size:13px;color:var(--dim);line-height:1.8}
.colb b{color:var(--ink)}
.colb ul{margin:6px 14px 0}
.colb li{margin-bottom:6px}
.src{font-size:11px;color:var(--dim);border-top:1px solid var(--line);margin-top:9px;padding-top:8px}
.nav{position:fixed;bottom:0;right:0;left:0;z-index:80;background:rgba(14,17,19,.94);
 backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:720px;margin:0 auto;display:flex}
.navbtn{flex:1;background:none;border:none;padding:9px 0 8px;color:var(--dim);font-size:10px;font-weight:700;cursor:pointer}
.navbtn i{font-style:normal;font-size:19px;display:block;margin-bottom:2px}
.navbtn.on{color:var(--acid)}
/* مدرّب قاع الحوض */
.kg{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.kgsvg{display:block;width:100%;max-width:300px;margin:0 auto}
.kgfloor{transition:transform 1.9s cubic-bezier(.4,0,.3,1)}
.kg.squeeze .kgfloor{transform:translateY(-13px)}
.kgarrow{opacity:0;transition:opacity .5s,transform 1.9s cubic-bezier(.4,0,.3,1)}
.kg.squeeze .kgarrow{opacity:1;transform:translateY(-13px)}
.kgring{stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.9s linear}
.kg.squeeze .kgring{stroke-dashoffset:0}
.kgcue{text-align:center;font-size:26px;font-weight:900;line-height:1.3;margin-top:10px;
 color:var(--dim);transition:color .3s}
.kg.squeeze .kgcue{color:var(--acid)}
.kgsub{text-align:center;color:var(--dim);font-size:12.5px;margin-top:2px}
.kgcount{display:flex;gap:9px;justify-content:center;margin-top:12px}
.kgcount b{background:var(--surf2);border-radius:9px;padding:7px 13px;font-size:13px;color:var(--ink)}
.kgcount b i{color:var(--acid);font-style:normal;font-weight:900}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.pill{background:var(--bg);border:1.5px solid var(--line);border-radius:99px;color:var(--dim);
 padding:8px 13px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.pill.on{background:var(--acid);border-color:var(--acid);color:#0E1113}
/* التنبيه اليومي */
.pop{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.74);display:flex;
 align-items:center;justify-content:center;padding:18px}
.popin{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:20px;
 width:100%;max-width:440px;max-height:82vh;overflow-y:auto}
.popd{color:var(--acid);font-size:11px;font-weight:800;letter-spacing:.06em;margin-bottom:5px}
.popt{font-size:20px;font-weight:900;line-height:1.35;margin-bottom:13px}
.popr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.popr span{font-size:17px;flex-shrink:0;line-height:1.35}
.popr p{margin:0;font-size:13.5px;line-height:1.6}
.popr p b{color:var(--acid)}
.popr p small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.tip{background:rgba(198,255,58,.07);border-right:3px solid var(--acid);border-radius:0 8px 8px 0;
 padding:8px 11px;margin-top:9px;font-size:12.5px;line-height:1.6;color:var(--ink)}
.tip b{color:var(--acid)}
.subwrap{display:flex;gap:6px;align-items:center;margin:-2px 0 10px 38px}
.subin{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;
 color:var(--ink);padding:8px 10px;font-size:12.5px;font-family:inherit;min-width:0}
.subin::placeholder{color:var(--dim);opacity:.75}
.subin:focus{outline:none;border-color:var(--acid)}
.subx{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--dim);
 padding:7px 9px;font-size:11px;cursor:pointer;flex-shrink:0}
.repbig{background:var(--surf2);border-right:3px solid var(--acid);border-radius:0 8px 8px 0;
 padding:7px 11px;margin-top:9px;font-size:12.5px;color:var(--dim);font-weight:500}
.repbig b{color:var(--acid);font-size:15px;font-weight:900}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;flex-shrink:0}
.tag.req{background:var(--acid);color:#0E1113}
.tag.bon{background:var(--surf2);color:var(--dim);border:1px solid var(--line)}
svg.ch{width:100%;height:170px;display:block}
textarea{width:100%;height:100px;background:var(--surf2);border:1px solid var(--line);color:var(--ink);
 border-radius:9px;padding:8px;font-size:11px;font-family:ui-monospace,monospace;resize:vertical}
.sv{text-align:center;font-size:11px;color:var(--dim);padding:6px 0}
.sv b{color:var(--acid)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div><h1>التمرين والأكل</h1><div class="sub" id="subline"></div></div>
    <div class="cd"><b id="cdays">—</b><span>يوم للفرح</span></div>
  </div>
  <div id="screens"></div>
  <div class="sv" id="sv"></div>
</div>
<nav class="nav"><div class="navin" id="navin"></div></nav>

<script>
(function(){
"use strict";
var IMG="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
var WED=new Date(2026,10,6), GOAL_START=84.5, GOAL_END=77.5, CARDIO_WK=160;
var PROT_LO=145, PROT_HI=160;              /* الهدف العملي — خطة v1 */
var SAFE_MAX=0.85;                          /* أقصى نزول آمن كجم/أسبوع */
var BOTTLES=6, BOTTLE_L=0.5;                /* ٦ أزايز نص لتر = ٣ لتر */
var PHASE_START=new Date(2026,8,13), PHASE_WKS=4;  /* المرحلة ٤ أسابيع، بدأت ١٣ سبتمبر */
var PHASE_SESS=18;                          /* هدف المرحلة: ١٨ تمرينة */
/* InBody 8 Sep 2026: 84.5kg | دهون 28.4kg (33.6%) | عضل هيكلي 31.6kg | كتلة صافية 56.1kg */
var LBM=56.1;  /* الكتلة الصافية — البروتين بيتحسب عليها مش على وزن الجسم */

/* ===== التخزين ===== */
var MODE="memory",MEM={};
try{var ls=window["local"+"Storage"];ls.setItem("__p","1");ls.removeItem("__p");MODE="local";}catch(e){}
var KEY="fit62";
function readAll(){if(MODE==="local"){try{var v=window["local"+"Storage"].getItem(KEY);return v?JSON.parse(v):null;}catch(e){}}return MEM[KEY]||null;}
function writeAll(o){if(MODE==="local"){try{window["local"+"Storage"].setItem(KEY,JSON.stringify(o));return;}catch(e){}}MEM[KEY]=o;}
var BKEY="fit62_bak";
function readBak(){if(MODE!=="local")return null;
 try{var v=window["local"+"Storage"].getItem(BKEY);if(!v)return null;var o=JSON.parse(v);
  return(o&&o.s&&o.s.d)?o:null;}catch(e){return null;}}
function writeBak(){if(MODE!=="local")return;
 try{window["local"+"Storage"].setItem(BKEY,JSON.stringify({t:ymd(new Date()),s:S}));}catch(e){}}

var S=readAll();
if(!S||!S.d){var bk=readBak();if(bk)S=bk.s;}   /* الأساسي باظ؟ رجّع من النسخة الاحتياطية */
if(!S)S={v:3,w:{},ws:{},d:{},b:{}};
["w","ws","hp","d","b"].forEach(function(k){if(!S[k])S[k]={};});

/* ===== ترقية v2 ← v3: بتعدّل في مكانها، مفيش استبدال ولا مسح ===== */
function migrate(){
 if(S.v>=3)return;
 for(var k in S.d){var o=S.d[k];if(!o)continue;
  /* أ) المية كانت ١٢ كوباية ← بقت ٦ أزايز نص لتر */
  if(o.water>BOTTLES)o.water=Math.min(BOTTLES,Math.round(o.water/2));
  /* ب) تنضيف مفاتيح الهجرة القديمة "الاسم:رقم" — الداتا بتتنقل للمفتاح الثابت الأول */
  if(o.ex)for(var e in o.ex){
   var i=e.indexOf(":");if(i<0)continue;
   var base=e.slice(0,i),old=o.ex[e]||{w:[],done:[]};
   var hasOld=(old.w&&old.w.join("")!=="")||(old.done&&old.done.filter(Boolean).length);
   var cur=o.ex[base],hasCur=cur&&((cur.w&&cur.w.join("")!=="")||(cur.done&&cur.done.filter(Boolean).length));
   if(hasOld&&!hasCur)o.ex[base]={w:(old.w||[]).slice(),done:(old.done||[]).slice()};
   delete o.ex[e];}}
 S.v=3;}
migrate();
var svT=null;
function save(){writeAll(S);
 var b=readBak();if(!b||b.t!==ymd(new Date()))writeBak();
 var e=document.getElementById("sv");e.innerHTML="<b>اتحفظ</b>";
 clearTimeout(svT);svT=setTimeout(function(){e.innerHTML=statusTxt();},1300);}
function statusTxt(){return MODE==="local"?"الحفظ شغال على الجهاز ده"
 :"<b style='color:#FF5C5C'>الحفظ مقفول</b> — اللي تسجله هيضيع لما تقفل الصفحة";}

/* ===== التواريخ ===== */
function p2(n){return n<10?"0"+n:""+n;}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function noon(d){var x=new Date(d);x.setHours(12,0,0,0);return x;}
function addD(d,n){var x=noon(d);x.setDate(x.getDate()+n);return x;}
function today(){return noon(new Date());}
function daysLeft(){var w=new Date(WED);w.setHours(0,0,0,0);var n=new Date();n.setHours(0,0,0,0);
 return Math.max(0,Math.round((w-n)/864e5));}
function fmtD(d){try{return d.toLocaleDateString("ar-EG",{day:"numeric",month:"long"});}
 catch(e){return d.getDate()+"/"+(d.getMonth()+1);}}
var DOWN=["الأحد","الاتنين","التلات","الأربعاء","الخميس","الجمعة","السبت"];

/* ===== التمارين ===== */
function E(o){return o;}
var PLAN={
 0:{t:"ضهر وبايسبس + بطن",req:true,upper:true,fact:"عضلات الضهر بتغيّر الوقفة وشكل القميص — أول حاجة الناس بتلاحظها.",ex:[
  {g:"أساسي",k:"Wide-Grip_Lat_Pulldown",ar:"سحب أمامي واسع",en:"Lat Pulldown",sets:3,reps:"١٠-١٢",
   cues:["صدرك عالي وميلة خفيفة لورا — مش قعدة مستقيمة","اسحب البار لأعلى صدرك، <b>مش ورا رقبتك</b>","نزّل كتفك لتحت الأول بعدين اثني كوعك"],alt:"سحب بقبضة ضيقة"},
  {k:"Seated_Cable_Rows",ar:"تجديف قاعد بالكابل",en:"Seated Cable Row",sets:3,reps:"١٠-١٢",
   cues:["ضهرك مفرود وصدرك لقدام — متقوّسش","اسحب المقبض لبطنك مش لصدرك","اعصر لوحي كتفك مع بعض في الآخر"],alt:"تجديف بالماكينة"},
  {k:"One-Arm_Dumbbell_Row",ar:"تجديف دامبل بذراع",en:"One-Arm DB Row",sets:3,reps:"١٠-١٢",
   cues:["إيدك ورجلك على الدكة وضهرك موازي للأرض","اسحب الدامبل لجنب خصرك مش لصدرك","<b>متلفش جسمك</b> عشان ترفع أتقل"],alt:"تجديف بالماكينة بذراع"},
  {g:"مساعد",k:"Straight-Arm_Pulldown",ar:"سحب مستقيم بالكابل",en:"Straight-Arm Pulldown",sets:3,reps:"١٢-١٥",
   cues:["كوعك فيه ثنية بسيطة <b>ثابتة</b>","الحركة من الكتف مش من الكوع","ميلة خفيفة من الورك مش من الضهر"],alt:"نفس التمرين بالحبل"},
  {k:"Face_Pull",ar:"سحب للوش",en:"Face Pull",sets:3,reps:"١٥",
   cues:["الكابل عند مستوى وشك","اسحب لحد جبهتك وافتح إيديك","<b>ده تمرين الوقفة والكتف</b> — بيفرد كتفك في الصور وبيحمي المفصل"],alt:"رفرفة خلفية"},
  {k:"Standing_Biceps_Cable_Curl",ar:"بايسبس بالكابل",en:"Cable Curl",sets:3,reps:"١٢",
   cues:["كوعك ملزوق في جنبك ومايتحركش لقدام","وقف ثانية فوق واعصر","نزّل ببطء — <b>الرجعة نص التمرين</b>"],alt:"بايسبس بالبار"},
  {k:"Hammer_Curls",ar:"هامر بالدامبل",en:"Hammer Curl",sets:2,reps:"١٢",

  {g:"بطن",k:"Cable_Crunch",ar:"طي البطن بالكابل (الجهاز اللي بتركع عليه)",en:"Cable Crunch",sets:3,reps:"١٥",
   cues:["<b>ده هو نفسه الجهاز اللي بتركع عليه وتقفل بطنك بوزن — مش بديل، ده التمرين بعينه.</b>","<b>اطوي من ضهرك مش من وركك</b> — تخيل إنك بتقرّب صدرك من حوضك، مش بتنزل بجسمك كله","<b>وركك ثابت في مكانه</b> — لو بتتحرك لقدام ولورا يبقى بتشد من الورك مش من البطن","الحمل هنا هو اللي بيبني العضلة — الكرانش من غير وزن مش كفاية","اعصر في الآخر ثانية وارجع ببطء"],alt:"كرانش على الأرض بوزن على صدرك"},
  {k:"Plank",ar:"بلانك",en:"Plank",sets:3,reps:"٣٠-٤٥ ثانية",
   cues:["جسمك خط مستقيم من كتفك لكعبك","<b>متطلعش مؤخرتك ومتنزلهاش</b>","اشد بطنك ومؤخرتك مع بعض"],alt:"بلانك على الركب",nw:true},
  {g:"كارديو",k:"Elliptical_Trainer",ar:"دراجة أو إليبتيكال",en:"Bike / Elliptical",sets:1,reps:"٢٠ دقيقة",cardio:20,
   cues:["<b>بعد الحديد مش قبله</b>","شدة تخليك تتكلم بصعوبة بس تقدر","مفيش جري"],alt:"مشي مائل على المشاية — سرعة ٥ وميل ١٠-١٢٪",nw:true}]},

 1:{t:"رجل وجذع + بطن",req:true,fact:"الحديد الأول والكارديو بعده — الترتيب ده لوحده بيفرق ٦.٩١٪ في قوة الرجل.",ex:[

   cues:["<b>لو الجهاز بحزام:</b> اقعد على الأرض أو الكرسي، الحزام على <b>عظمة الحوض مش على البطن</b>، ورجلك بعرض الكتف","ادفع من <b>كعبك</b> واعصر المؤخرة لحد ما جسمك يبقى خط مستقيم من الركبة للكتف","الحوض هو اللي بيلف — <b>متقوّسش ضهرك</b>. ابدأ بأخف وزن عشان تحس بالحركة الأول","وقف ثانية فوق وانزل ببطء"],alt:"جسر المؤخرة على الأرض من غير وزن"},
  {k:"Romanian_Deadlift",ar:"الرفعة الرومانية",en:"Romanian Deadlift",sets:3,reps:"١٠",
   cues:["<b>حركة ورك مش حركة ركبة</b> — طلّع مؤخرتك لورا","ركبتك فيها ثنية بسيطة ثابتة","البار ملزوق في رجلك، وضهرك مفرود طول الوقت"],alt:"نفس الحركة بدامبلين"},
  {k:"Lying_Leg_Curls",ar:"ثني الرجل راقد",en:"Lying Leg Curl",sets:3,reps:"١٢",

  {k:"Leg_Press",ar:"ضغط رجل بمدى محدود",en:"Leg Press",sets:3,reps:"١٢",
   cues:["<b>وقف عند ٩٠ درجة — متنزلش أعمق</b>","رجلك بعرض الكتف في نص المنصة","متفردش ركبتك بالكامل فوق"],alt:"ضغط رجل أفقي"},
  {k:"Thigh_Abductor",ar:"تبعيد الفخذ",en:"Hip Abduction",sets:3,reps:"١٥",

  {k:"Leg_Extensions",ar:"مد الرجل — اختياري",en:"Leg Extension",sets:3,reps:"١٥",

  {g:"بطن",k:"Dead_Bug",ar:"الحشرة الميتة",en:"Dead Bug",sets:3,reps:"١٠ لكل جنب",

  {k:"Side_Bridge",ar:"بلانك جانبي",en:"Side Plank",sets:2,reps:"٣٠ ثانية لكل جنب",
   cues:["جسمك خط مستقيم من الكتف للكاحل","ارفع حوضك عالي ومتسيبهوش ينزل","بيشد الجناب — الحتة اللي بتبان فوق البنطلون"],alt:"على الركبة",nw:true},
  {g:"كارديو",k:"Elliptical_Trainer",ar:"دراجة أو إليبتيكال",en:"Bike / Elliptical",sets:1,reps:"٢٠ دقيقة",cardio:20,

  {k:"Cat_Stretch",ar:"تمدد القطة",en:"Cat-Cow",sets:2,reps:"١٠",

  {k:"Shoulder_Circles",ar:"دوائر الكتف",en:"Shoulder Circles",sets:2,reps:"١٠ لكل اتجاه",

  {k:"Side_Bridge",ar:"بلانك جانبي",en:"Side Plank",sets:2,reps:"٣٠ ثانية لكل جنب",

  {k:"Butterfly",ar:"تفتيح (بيك ديك) — مدى محدود",en:"Pec Deck",sets:2,reps:"١٢-١٥",
   cues:["<b>متفتحش أوسع من مستوى صدرك</b> — الفتح الزيادة بيشد مقدمة الكتف، وكتفك بيطقطق","كوعك فيه ثنية بسيطة ثابتة","اقفل واعصر ثانية في النص","<b>نزّلناه لمجموعتين</b>: النهارده فيه ٤ حركات دفع (ماكينة + دامبل + تفتيح + ضغط) — كتير على كتف بيطقطق"],alt:"تفتيح بالكابل بمدى أقصر"},
  {g:"ترايسبس",k:"Triceps_Pushdown_-_Rope_Attachment",ar:"ترايسبس بالحبل",en:"Rope Pushdown",sets:3,reps:"١٢-١٥",
   cues:["كوعك ملزوق في جنبك","افتح الحبل في الآخر واعصر","<b>ممنوع تدفع بوزن جسمك</b>"],alt:"نفس التمرين بالبار"},
  {k:"Cable_Rope_Overhead_Triceps_Extension",ar:"ترايسبس من فوق",en:"Overhead Extension",sets:3,reps:"١٢",
   cues:["الحبل من ورا راسك وكوعك عالي وثابت","<b>ده الجزء اللي بيدي حجم للدراع من ورا</b>","افرد بالكامل بس من غير قفل عنيف"],alt:"نفس التمرين بالدامبل"},
  {g:"ختام + بطن",k:"Pushups",ar:"ضغط",en:"Push-Ups",sets:3,reps:"للفشل",rs:"أقصى",
   cues:["جسمك خط مستقيم — <b>متطلعش مؤخرتك</b>","كوعك على ٤٥ درجة من جسمك مش مفرود لبره","<b>للفشل</b> يعني لحد ما مش قادر تعمل تكرار نضيف — سجّل العدد في خانة الوزن","لو صعب: على الركب أو على حافة الدكة"],alt:"ضغط على الركب أو على دكة مايلة"},
  {k:"Flat_Bench_Lying_Leg_Raise",ar:"رفع الرجل راقد",en:"Lying Leg Raise",sets:3,reps:"١٢",
   cues:["أسفل ضهرك ملزوق في الدكة — <b>امسك جنب الدكة بإيدك</b>","نزّل رجلك ببطء ومتخليهاش توصل الأرض","لو ضهرك اتقوّس، اثني ركبتك شوية"],alt:"الحشرة الميتة",nw:true},
  {g:"كارديو",k:"Elliptical_Trainer",ar:"دراجة أو إليبتيكال",en:"Bike / Elliptical",sets:1,reps:"٢٠ دقيقة",cardio:20,
   cues:["<b>بعد الحديد</b>","شدة متوسطة لعالية","مفيش جري"],alt:"مشي مائل على المشاية",nw:true}]},

 5:{t:"التحمل والحمل — أهم يوم بونس",bonus:true,sauna:true,key:true,
  fact:"ترتيب اليوم مقصود: إحماء ٥ د ← حديد ٢٥-٣٠ د ← فترات ٤٠ د. <b>الفترات آخر حاجة عشان تعملها وإنت فاضي، مش عشان تتساب.</b> لو الوقت ضاق، اقص من الحديد مش من الكارديو — الكارديو هو الحدث الرئيسي في اليوم ده.",ex:[
  {g:"١ — المؤخرة والحوض (٢٥-٣٠ دقيقة)",k:"Barbell_Hip_Thrust",ar:"جسر المؤخرة",en:"Hip Thrust",sets:3,reps:"١٢",
   cues:["<b>٥ كجم خفيف جداً — ضاعفه الأسبوع ده.</b> لو خلصت ١٢ تكرار وإنت مرتاح، الوزن صغير","<b>تاني مرة في الأسبوع عن قصد</b> — المؤخرة وقاع الحوض نفس المنطقة ونفس الشبكة الدموية","الحزام على عظمة الحوض مش على البطن، وادفع من كعبك","اعصر فوق ثانية كاملة — <b>العصرة هي التمرين</b> مش الرفعة"],alt:"جسر المؤخرة على الأرض من غير وزن"},
  {k:"One-Arm_Kettlebell_Swings",ar:"مرجحة بذراع واحدة",en:"One-Arm Swing",sets:3,reps:"١٢ لكل إيد",
   cues:["<b>٤ كجم خفيف — ضاعفه.</b> المرجحة بتاخد وزن أتقل من اللي تتخيله","<b>حركة ورك مش حركة دراع</b> — الوزن بيتمرجح بدفعة من المؤخرة","<b>متعليهاش فوق مستوى صدرك</b> — عشان الكتف","<b>مفيش قفز</b> — رجلك ثابتة على الأرض طول الوقت"],alt:"نفس الحركة بدامبل واحد بإيدين"},
  {g:"٢ — الجذع وأسفل الضهر",k:"Russian_Twist",ar:"اللفة الروسية",en:"Russian Twist",sets:3,reps:"٢٠ (١٠ لكل جنب)",
   cues:["<b>بديل مشية الفلاح</b> — نفس شغل الجذع، بس بالعدّ مش بالمتر","قاعد ومايل لورا شوية، امسك دامبل أو صابة بإيديك","<b>لفّ من جذعك مش من دراعك</b> — الوزن بيعدّي من جنب لجنب ببطء","<b>ضهرك مفرود ومتقوّسش</b> — لو ضهرك اتقوّس، خفّف الوزن","الجذع فيه ١٥ كجم دهون عندك — دي العضلة اللي تحتها"],alt:"نفس الحركة من غير وزن ورجلك على الأرض"},
  {k:"Hyperextensions_Back_Extensions",ar:"مد الظهر",en:"Back Extension",sets:3,reps:"١٢",
   cues:["اطلع لحد ما جسمك يبقى خط مستقيم — <b>متقوّسش لفوق</b>","الحركة من الورك مش من الضهر","بيقوي أسفل الضهر والمؤخرة — والاتنين بيشتغلوا مع قاع الحوض"],alt:"سوبرمان على الأرض"},

function chartOf(SRC,goal,color,unit){
